id: minio
name: MinIO
category: 存储
desc: 兼容 S3 的对象存储。社区版官方已停止发布程序：请导入自己编译或以前下载的 minio 程序（Linux 版）
homepage: https://github.com/minio/minio
params:
  - key: port
    label: API 端口
    type: port
    default: "9000"
  - key: console
    label: 控制台端口
    type: port
    default: "9001"
  - key: public
    label: 允许其他机器访问
    type: bool
  - key: account
    label: 账号
    type: account
    default: minioadmin
    help: 管理员账号（MINIO_ROOT_USER），登录控制台、用 S3 工具管理时用
  - key: password
    label: 密码
    type: password
variants:
  - label: 导入的程序
    note: 先在「导入安装包」里选你的 minio 程序（单个文件）
    user: minio
    package:
      format: binary
      into: minio
    steps:
      - run: mkdir -p ${dir}/data
    service:
      exec: ${dir}/minio server ${dir}/data --address ${public?0.0.0.0|127.0.0.1}:${port} --console-address ${public?0.0.0.0|127.0.0.1}:${console}
      workdir: ${dir}
      env: {MINIO_ROOT_USER: "${account}", MINIO_ROOT_PASSWORD: "${password}"}
      ready: {port: "${port}", timeout: 60}
    notes:
      - API：${host}:${port}；控制台：http://${host}:${console}/ ，账号 ${account}，密码见「密码」

# 安装时可以补充的配置（参数没有的设置）：作为服务的环境变量
extras:
  - id: env
    label: MinIO 环境变量
    format: env
    help: 写进只有 root 能读的 ferry.env，MinIO 启动时读取；账号、密码用上面的参数
    protect: [MINIO_VOLUMES, MINIO_OPTS, MINIO_ROOT_USER_FILE, MINIO_ROOT_PASSWORD_FILE]
    suggest:
      - {key: MINIO_SERVER_URL, example: "https://s3.example.com", help: 经反向代理访问时，对外的 API 地址}
      - {key: MINIO_BROWSER_REDIRECT_URL, example: "https://console.example.com", help: 经反向代理访问时，对外的控制台地址}
      - {key: MINIO_SITE_REGION, example: cn-east-1, help: 区域名}
      - {key: MINIO_DOMAIN, example: s3.example.com, help: 用虚拟主机方式访问存储桶时的域名}
