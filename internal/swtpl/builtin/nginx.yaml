id: nginx
name: Nginx
category: 网络
desc: 独立的 Nginx 实例，可在添加前端项目时选择；多个项目共用实例，各自管理站点配置
params:
  - {key: port, label: 初始监听端口, type: port, default: "80"}
variants:
  - label: 系统软件源（dnf / yum）
    os: [rhel, centos, fedora]
    user: nginx
    system: {dnf: [nginx], disable: [nginx.service], require: /usr/sbin/nginx}
    selinux: {files: httpd_sys_rw_content_t, port: http_port_t}
    files: &files
      - path: ${dir}/nginx.conf
        mode: "0644"
        content: |
          # 独立 nginx 实例；项目站点位于 sites/，由各项目的 ferry.yaml 管理
          daemon off;
          worker_processes auto;
          pid ${dir}/run/nginx.pid;
          error_log ${dir}/logs/error.log warn;
          events { worker_connections 4096; }
          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              sendfile on;
              access_log ${dir}/logs/access.log;
              client_body_temp_path ${dir}/tmp/client_body;
              proxy_temp_path ${dir}/tmp/proxy;
              fastcgi_temp_path ${dir}/tmp/fastcgi;
              uwsgi_temp_path ${dir}/tmp/uwsgi;
              scgi_temp_path ${dir}/tmp/scgi;
              map $http_upgrade $connection_upgrade { default upgrade; '' close; }
              server { listen ${port}; server_name ferry-welcome.invalid; return 200 "Nginx is ready\n"; }
              include ${dir}/sites/*.conf;
          }
    steps: &steps
      - run: mkdir -p ${dir}/run ${dir}/logs ${dir}/tmp ${dir}/sites
    service: &service
      exec: /usr/sbin/nginx -p ${dir}/ -c ${dir}/nginx.conf
      workdir: ${dir}
      ready: {port: "${port}", timeout: 60}
    configs: &configs
      - {label: 主配置, path: "${dir}/nginx.conf", format: nginx, apply: reload}
    hosting: &hosting
      binary: /usr/sbin/nginx
      config: ${dir}/nginx.conf
      prefix: ${dir}
      sites: ${dir}/sites
    logs: &logs ["${dir}/logs/error.log", "${dir}/logs/access.log"]
    notes: ["添加前端项目时选择此 nginx 实例，站点端口、域名、接口代理由项目配置管理"]
  - label: 系统软件源（apt）
    os: [debian, ubuntu]
    user: www-data
    system: {apt: [nginx], disable: [nginx.service], require: /usr/sbin/nginx}
    files: *files
    steps: *steps
    service: *service
    configs: *configs
    hosting: *hosting
    logs: *logs
