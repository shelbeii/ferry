id: redis
name: Redis
category: 缓存
desc: 缓存数据库。程序用服务器的软件源安装，由 Ferry 单独运行一个实例（自己的配置、数据目录）
homepage: https://redis.io
params:
  - key: port
    label: 端口
    type: port
    default: "6379"
  - key: public
    label: 允许其他机器访问
    type: bool
    help: 不勾选时只监听 127.0.0.1
  - key: password
    label: 密码
    type: password
    help: 连接 Redis 用的密码（requirepass）。Redis 只用密码，没有账号
variants:
  - label: 系统软件源（dnf / yum）
    os: [rhel, centos, fedora]
    note: 用服务器配置的软件源；服务器连不上时下载可以经这台电脑。RHEL / Rocky 10 起软件源里没有 redis：自动改装兼容 Redis 的 Valkey
    user: redis
    system:
      # RHEL / Rocky 10、新版 Fedora 只有 Valkey：valkey-compat-redis 提供 redis-server、redis-cli
      dnf: ["redis|valkey-compat-redis"]
      disable: [redis.service, valkey.service]
      require: /usr/bin/redis-server
    selinux: {files: redis_var_lib_t, port: redis_port_t}
    files: &files
      - path: ${dir}/redis.conf
        content: |
          # 由 Ferry 生成（软件 ${name}）
          bind ${public?0.0.0.0|127.0.0.1}
          port ${port}
          dir ${dir}/data
          logfile ${dir}/logs/redis.log
          requirepass ${password}
          appendonly yes
          daemonize no
      # 就绪后用设置的密码连一次（密码放在只有 root 能读的文件里，不出现在命令行上）
      - path: ${dir}/ferry-check.pw
        at: ready
        mode: "0600"
        content: "${password}"
    steps: &steps
      - run: mkdir -p ${dir}/data ${dir}/logs
      # 只有密码不对才算失败（没有 redis-cli 时不查）
      - at: ready
        run: |
          r=0
          if command -v redis-cli >/dev/null 2>&1; then
            out=$(printf 'AUTH %s\nPING\n' "$(cat ${dir}/ferry-check.pw)" | redis-cli -p ${port} 2>&1)
            case "$out" in *WRONGPASS*|*"invalid password"*|*NOAUTH*) echo "$out"; r=1;; esac
          fi
          rm -f ${dir}/ferry-check.pw
          exit $r
        error: Redis 已经启动，但用设置的密码连不上
    service: &service
      exec: /usr/bin/redis-server ${dir}/redis.conf
      workdir: ${dir}
      ready: {port: "${port}", timeout: 60}
    logs: &logs ["${dir}/logs/redis.log"]
    configs: &configs
      - {label: Redis 配置, path: "${dir}/redis.conf", apply: restart}
    notes: &notes
      - 连接 ${host}:${port}，密码见「密码」
  - label: 系统软件源（apt）
    os: [debian, ubuntu]
    note: 用服务器配置的软件源；服务器连不上时下载可以经这台电脑
    user: redis
    system:
      apt: [redis-server]
      disable: [redis-server.service]
      require: /usr/bin/redis-server
    files: *files
    steps: *steps
    service: *service
    logs: *logs
    configs: *configs
    notes: *notes
