id: mariadb
name: MariaDB
category: 数据库
desc: 兼容 MySQL 的数据库。程序用服务器的软件源安装，由 Ferry 单独运行一个实例（自己的配置、数据目录）
homepage: https://mariadb.org
params:
  - key: port
    label: 端口
    type: port
    default: "3306"
  - key: public
    label: 允许其他机器访问
    type: bool
    help: 不勾选时只监听 127.0.0.1；勾选后下面的账号可以从其他机器登录，注意用防火墙限制来源
  - key: account
    label: 账号
    type: account
    default: root
    help: 登录用的账号，有全部权限。不是 root 时，root 也用下面的密码，但只能从本机登录
  - key: password
    label: 密码
    type: password
  - key: lowerCase
    label: 表名不区分大小写
    type: bool
    help: lower_case_table_names=1：只能在安装时设置，以后改不了
variants:
  - label: 系统软件源（dnf / yum）
    os: [rhel, centos, fedora]
    note: 用服务器配置的软件源；服务器连不上时下载可以经这台电脑
    user: mysql
    system:
      dnf: [mariadb-server]
      disable: [mariadb.service]
    selinux: {files: mysqld_db_t, port: mysqld_port_t}
    files: &files
      - path: ${dir}/my.cnf
        content: |
          # 由 Ferry 生成（软件 ${name}）
          [mysqld]
          datadir=${dir}/data
          socket=${dir}/mysql.sock
          pid-file=${dir}/mysqld.pid
          port=${port}
          bind-address=${public?0.0.0.0|127.0.0.1}
          log-error=${dir}/logs/error.log
          character-set-server=utf8mb4
          lower_case_table_names=${lowerCase?1|0}
          # 第一次启动时设置 root 密码，就绪后去掉
          init-file=${dir}/tmp/ferry-init.sql

          [client]
          socket=${dir}/mysql.sock
          port=${port}
      - path: ${dir}/tmp/ferry-init.sql
        mode: "0600"
        content: |
          ALTER USER 'root'@'localhost' IDENTIFIED BY '${password}';
          CREATE USER IF NOT EXISTS '${account}'@'localhost' IDENTIFIED BY '${password}';
          GRANT ALL PRIVILEGES ON *.* TO '${account}'@'localhost' WITH GRANT OPTION;
          ${public?CREATE USER IF NOT EXISTS '${account}'@'%' IDENTIFIED BY '${password}'; GRANT ALL PRIVILEGES ON *.* TO '${account}'@'%' WITH GRANT OPTION;|}
          FLUSH PRIVILEGES;
      - path: ${dir}/my.cnf
        at: ready
        content: |
          # 由 Ferry 生成（软件 ${name}）
          [mysqld]
          datadir=${dir}/data
          socket=${dir}/mysql.sock
          pid-file=${dir}/mysqld.pid
          port=${port}
          bind-address=${public?0.0.0.0|127.0.0.1}
          log-error=${dir}/logs/error.log
          character-set-server=utf8mb4
          lower_case_table_names=${lowerCase?1|0}

          [client]
          socket=${dir}/mysql.sock
          port=${port}
      # 就绪后用设置的密码登录一次，确认真的能用（密码放在只有 root 能读的文件里，不出现在命令行上）
      - path: ${dir}/tmp/ferry-check.cnf
        at: ready
        mode: "0600"
        content: |
          [client]
          user=${account}
          password="${password}"
          socket=${dir}/mysql.sock
    steps: &steps
      - run: mkdir -p ${dir}/data ${dir}/logs ${dir}/tmp
      # 各发行版的服务端程序位置不同：链接到安装目录里
      - run: for p in /usr/sbin/mariadbd /usr/libexec/mariadbd /usr/sbin/mysqld /usr/libexec/mysqld; do if [ -x $p ]; then ln -sfn $p ${dir}/mariadbd; break; fi; done; test -x ${dir}/mariadbd
        error: 软件源装好了，但找不到 MariaDB 的服务端程序（mariadbd / mysqld）
      - at: init
        run: "$(command -v mariadb-install-db || command -v mysql_install_db) --defaults-file=${dir}/my.cnf --user=${user} --auth-root-authentication-method=normal >/dev/null || { tail -n 8 ${dir}/logs/error.log; exit 1; }"
        error: 初始化数据目录失败
      # 只有密码不对才算失败（客户端运行不了时不拦着）
      - at: ready
        run: |
          r=0
          m=$(command -v mariadb || command -v mysql || true)
          if [ -n "$m" ]; then
            out=$("$m" --defaults-extra-file=${dir}/tmp/ferry-check.cnf -N -e 'select 1' 2>&1) || case "$out" in *1045*|*1698*|*"Access denied"*) echo "$out"; r=1;; esac
          fi
          rm -f ${dir}/tmp/ferry-check.cnf
          exit $r
        error: MariaDB 已经启动，但用设置的账号和密码登录不上
      - at: ready
        run: rm -f ${dir}/tmp/ferry-init.sql
    service: &service
      exec: ${dir}/mariadbd --defaults-file=${dir}/my.cnf
      workdir: ${dir}
      ready: {port: "${port}", timeout: 120}
    logs: &logs ["${dir}/logs/error.log"]
    logrotate: true
    configs: &configs
      - {label: MariaDB 配置, path: "${dir}/my.cnf", apply: restart}
    notes: &notes
      - 连接 ${host}:${port}，账号 ${account}，密码见「密码」；${public?允许其他机器连接（注意防火墙）|只允许本机连接（127.0.0.1）}
  - label: 系统软件源（apt）
    os: [debian, ubuntu]
    note: 用服务器配置的软件源；服务器连不上时下载可以经这台电脑
    user: mysql
    system:
      apt: [mariadb-server]
      disable: [mariadb.service]
    files: *files
    steps: *steps
    service: *service
    logs: *logs
    logrotate: true
    configs: *configs
    notes: *notes
