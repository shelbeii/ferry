[package]
name = "ferry-desktop"
version = "0.13.61"
description = "Ferry 部署工具桌面版"
edition = "2021"

[lib]
name = "ferry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：内置浏览器的网页视图放在主窗口里；devtools：macOS 上浏览器网页的开发者工具（发布版也能用）
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 内置浏览器：取网页的调试编号、图标，拦下网页里的 F12（版本和 Tauri 用的一致）
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
