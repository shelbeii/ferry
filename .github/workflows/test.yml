name: Go 跨平台测试

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/test.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 测试（禁用测试结果缓存）
        run: go test -count=1 ./...
