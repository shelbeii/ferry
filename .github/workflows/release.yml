# 发布：推送 v 开头的标签（如 v0.12.80）时，构建 Linux 版 ferry（amd64、arm64）、Windows 安装包、macOS 安装包（Apple 芯片、Intel），
# 建一个 GitHub Release 并附上它们、SHA256SUMS.txt 和它的签名 SHA256SUMS.txt.sig。标签要和 desktop/package.json 里的版本号一致（v + 版本号），不一致时不发布。
# 签名的私钥在仓库 Settings → Secrets 的 FERRY_SIGN_KEY（scripts/signsums）；没有它、或者和编进 Ferry 的公钥不是一对时不发布——
# Ferry 自动更新时验这个签名，没签名的版本装不上。
#
#   git tag v0.12.80 && git push origin v0.12.80
#
# 同一个标签重新运行时，已有的 Release 里的文件和发布说明会被更新。
name: 发布

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: 核对版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = p => fs.readFileSync(p, 'utf8');
          const version = JSON.parse(read('desktop/package.json')).version;
          const lock = JSON.parse(read('desktop/package-lock.json'));
          const versions = {
            'package-lock.json': lock.version,
            'package-lock.json packages[""]': lock.packages['']?.version,
            'tauri.conf.json': JSON.parse(read('desktop/src-tauri/tauri.conf.json')).version,
            'Cargo.toml': read('desktop/src-tauri/Cargo.toml').match(/^version\s*=\s*"([^"]+)"/m)?.[1],
            'Cargo.lock': read('desktop/src-tauri/Cargo.lock').match(/^name = "ferry-desktop"\r?\nversion = "([^"]+)"/m)?.[1],
          };
          if (!/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(version) || process.env.GITHUB_REF_NAME !== 'v' + version) {
            throw new Error('标签和 package.json 正式版版本号不一致');
          }
          for (const [name, value] of Object.entries(versions)) {
            if (value !== version) throw new Error(name + ' 的版本号与 package.json 不一致');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\n');
          NODE
      - name: 检查发布说明生成
        run: node --test scripts/release-notes.test.mjs

  linux:
    name: Linux 版 ferry
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 测试
        run: go test ./...
      - name: 构建（内嵌服务器端组件）
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          bash scripts/build.sh                 # 先编译要内嵌的 agent（linux amd64、arm64）
          export CGO_ENABLED=0
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o dist/ferry-linux-$arch ./cmd/ferry
          done
          ./dist/ferry-linux-amd64 version
      - uses: actions/upload-artifact@v7
        with:
          name: ferry-linux
          path: dist/ferry-linux-*
          if-no-files-found: error

  windows:
    name: Windows 安装包
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: 安装前端依赖
        working-directory: desktop
        run: npm ci
      - name: 前端测试
        working-directory: desktop
        run: npm test
      - name: 构建安装包
        working-directory: desktop
        run: npx tauri build --bundles nsis --ci
      - uses: actions/upload-artifact@v7
        with:
          name: ferry-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS 安装包
    needs: check
    uses: ./.github/workflows/macos.yml

  release:
    name: 建 Release
    needs: [check, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v7
        with:
          path: files
          merge-multiple: true
      - name: 校验和
        working-directory: files
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 签名
        env:
          FERRY_SIGN_KEY: ${{ secrets.FERRY_SIGN_KEY }}
        run: go run ./scripts/signsums sign -key-env FERRY_SIGN_KEY files/SHA256SUMS.txt
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          node scripts/release-notes.mjs --tag "$TAG" --repo "$GITHUB_REPOSITORY" --releases releases.json --output notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" files/* --clobber
          else
            gh release create "$TAG" files/* --title "Ferry $VERSION" --notes-file notes.md
          fi
